<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#11100f" />
    <meta name="description" content="Comeback — build consistency, one day at a time." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Comback" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <script>
      (() => {
        const themes = ["orange", "purple", "emerald", "ocean-blue", "rose-pink"];
        try {
          const theme = localStorage.getItem("comeback-theme");
          document.documentElement.dataset.theme = themes.includes(theme) ? theme : "orange";
        } catch {
          document.documentElement.dataset.theme = "orange";
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Rubik+Storm&display=swap" rel="stylesheet" />
    <title>Comeback — your daily rhythm</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
